<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Free ranked no-limit hold'em, heads-up or six handed. No money, no ads, no rake." />
    <!-- The browser chrome matches the page. Dark is the unconditional
         default, so this is g-system's --bg in dark (--slate-1); it is a
         literal because a meta tag cannot read a custom property. -->
    <meta name="theme-color" content="#111113" />
    <!-- The mark is favicon.svg; the PNGs are rendered from it for the
         browsers and the home screens that will not take an SVG. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Installable to a home screen, standalone, dark ground. No service
         worker on purpose: the table is a websocket, so there is nothing
         useful to serve offline and a stale cached shell would only hide a
         deploy. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Open Table</title>
    <link rel="stylesheet" href="/g/g.css" />
    <!-- Four attribute writes before the first paint, so a light theme, a
         palette or a four colour deck is never a flash of the dark default. g-ui reads its
         own g-theme key a moment later and lands on the same answer, because
         the app writes both in one call (src/ui/prefs.ts). Attributes only:
         what jade is, what felt is, and what a four colour deck is, are in
         app.css and palettes.css. -->
    <script>
      (() => {
        try {
          const p = JSON.parse(localStorage.getItem('ot.prefs') || '{}');
          const el = document.documentElement;
          if (p.theme === 'light' || p.theme === 'system') el.setAttribute('data-theme', p.theme);
          if (p.palette && p.palette !== 'slate') el.setAttribute('data-palette', p.palette);
          if (p.accent && p.accent !== 'default') el.setAttribute('data-accent', p.accent);
          if (p.fourColour) el.setAttribute('data-deck', 'four');
        } catch {}
      })();
    </script>
    <script defer src="/g/g-ui.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Open Table needs JavaScript. The table, the replays and the tools all run in your browser.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
