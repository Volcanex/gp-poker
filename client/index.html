<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Free ranked no-limit hold'em, heads-up or six handed. No money, no ads, no rake." />
    <!-- The browser chrome matches the page. The games room is the default a
         visitor gets, so this is its --bg (--slate-1 in src/room.css); it is a
         literal because a meta tag cannot read a custom property. -->
    <meta name="theme-color" content="#14100c" />
    <!-- The mark is favicon.svg; the PNGs are rendered from it for the
         browsers and the home screens that will not take an SVG. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Installable to a home screen, standalone, dark ground. No service
         worker on purpose: the table is a websocket, so there is nothing
         useful to serve offline and a stale cached shell would only hide a
         deploy. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Open Table</title>
    <link rel="stylesheet" href="/g/g.css" />
    <!-- Six attribute writes before the first paint, so a chosen theme, a
         palette, a four colour deck or a card size is never a flash of the
         wrong ground.
         g-ui reads its own g-theme key a moment later and lands on the same
         answer, because the app writes both in one call (src/ui/prefs.ts).
         Attributes only: what jade is, what felt is, what the games room is,
         what a four colour deck is and which way the hero band faces are in
         app.css, palettes.css, room.css and hero-band.css. -->
    <script>
      (() => {
        try {
          const p = JSON.parse(localStorage.getItem('ot.prefs') || '{}');
          const el = document.documentElement;
          /* No record, or one this build does not read, is the games room,
             exactly as readPrefs in src/ui/prefs.ts decides it. */
          const theme = ['room', 'dark', 'light', 'system'].includes(p.theme) ? p.theme : 'room';
          if (theme !== 'dark') el.setAttribute('data-theme', theme);
          if (theme !== 'room') {
            if (p.palette && p.palette !== 'slate') el.setAttribute('data-palette', p.palette);
            if (p.accent && p.accent !== 'default') el.setAttribute('data-accent', p.accent);
          }
          if (p.fourColour) el.setAttribute('data-deck', 'four');
          if (p.hand === 'left') el.setAttribute('data-hand', 'left');
          /* The band's height is derived from these two, so a record read a
             frame late is a band that resizes under the player's thumb. */
          if (['side', 'ajar'].includes(p.cards)) el.setAttribute('data-cards', p.cards);
          if (['regular', 'huge'].includes(p.cardSize)) el.setAttribute('data-card-size', p.cardSize);
        } catch {}
      })();
    </script>
    <script defer src="/g/g-ui.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Open Table needs JavaScript. The table, the replays and the tools all run in your browser.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
