<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Free ranked no-limit hold'em, heads-up or six handed. No money, no ads, no rake." />
    <!-- The browser chrome matches the page. Dark felt is the default a
         visitor gets, so this is its --bg (--slate-1 in src/room.css); it is a
         literal because a meta tag cannot read a custom property. -->
    <meta name="theme-color" content="#111111" />
    <!-- The mark is favicon.svg; the PNGs are rendered from it for the
         browsers and the home screens that will not take an SVG. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Installable to a home screen, standalone, dark ground. No service
         worker on purpose: the table is a websocket, so there is nothing
         useful to serve offline and a stale cached shell would only hide a
         deploy. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- The g-admin overlay's stub (inside g-ui.js) reads this to label the
         bar and to know which project it is talking to; the base path stays
         the contract's default (/api/gadmin), so no g-admin-base tag.
         g-command is the dashboard the bar's ticket count and Command centre
         link open; without it the bar leaves both out. -->
    <meta name="g-admin-project" content="poker" />
    <meta name="g-command" content="https://command.gabrielpenman.com" />
    <title>EveryonePoker</title>
    <link rel="stylesheet" href="/g/g.css" />
    <!-- Six attribute writes before the first paint, so a chosen theme, a
         palette, a four colour deck or a card size is never a flash of the
         wrong ground.
         g-ui reads its own g-theme key a moment later and lands on the same
         answer, because the app writes both in one call (src/ui/prefs.ts).
         Attributes only: what jade is, what felt is, what the games room is,
         what a four colour deck is and which way the hero band faces are in
         app.css, palettes.css, room.css and hero-band.css. -->
    <script>
      (() => {
        try {
          const p = JSON.parse(localStorage.getItem('ot.prefs') || '{}');
          const el = document.documentElement;
          /* No record, or one this build does not read, is dark felt,
             exactly as readPrefs in src/ui/prefs.ts decides it. */
          const theme = ['dark-felt', 'room', 'dark', 'light', 'system'].includes(p.theme) ? p.theme : 'dark-felt';
          if (theme !== 'dark') el.setAttribute('data-theme', theme);
          if (theme !== 'room' && theme !== 'dark-felt') {
            if (p.palette && p.palette !== 'slate') el.setAttribute('data-palette', p.palette);
            if (p.accent && p.accent !== 'default') el.setAttribute('data-accent', p.accent);
          }
          if (p.fourColour) el.setAttribute('data-deck', 'four');
          if (p.hand === 'left') el.setAttribute('data-hand', 'left');
          /* Board size, with the pre three-size records still readable: an
             old `bigBoard: true` is today's `medium`. Absent means the
             default, which is medium, so it is written too. */
          const board = ['regular', 'medium', 'big'].includes(p.boardSize) ? p.boardSize
            : typeof p.bigBoard === 'boolean' ? (p.bigBoard ? 'medium' : 'regular')
            : 'medium';
          if (board !== 'regular') el.setAttribute('data-board-size', board);
          /* The band's height is derived from these two, so a record read a
             frame late is a band that resizes under the player's thumb. */
          if (['side', 'ajar'].includes(p.cards)) el.setAttribute('data-cards', p.cards);
          if (['regular', 'huge'].includes(p.cardSize)) el.setAttribute('data-card-size', p.cardSize);
          /* The phone felt's own grid hangs off this one. */
          if (p.seatDetail === 'detailed') el.setAttribute('data-seat-detail', 'detailed');
        } catch {}
      })();
    </script>
    <script defer src="/g/g-ui.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      EveryonePoker needs JavaScript. The table, the replays and the tools all run in your browser.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
    <!-- g-admin's reapply layer (this project sets GADMIN_REAPPLY=1): CSS
         generated from open tickets' unbaked edits, so a spacing/typography
         change made in edit mode survives a reload before it is baked. Public,
         no auth, empty when there is nothing to reapply. Placed last in the
         document - after the build's own stylesheet, wherever Vite ends up
         emitting that - so an override always wins the cascade tie the
         contract expects, rather than depending on where a bundler's own
         injected <link> lands in <head>. -->
    <link rel="stylesheet" href="/api/gadmin/overrides.css" />
  </body>
</html>
